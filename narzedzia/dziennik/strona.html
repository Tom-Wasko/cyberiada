<title>Dziennik cyberiady</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--szmaragd:#059669;--kosmos:#7c3aed;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6a6862;--grid:#e1e0d9;--axis:#c3c2b7;--link:#1f66bd;
  --border:rgba(11,11,11,.10);--ok-text:#006300;--hover:rgba(11,11,11,.05);
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--szmaragd:#10b981;--kosmos:#a78bfa;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--link:#3987e5;
  --border:rgba(255,255,255,.10);--ok-text:#0ca30c;--hover:rgba(240,239,236,.07);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--szmaragd:#10b981;--kosmos:#a78bfa;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--link:#3987e5;
  --border:rgba(255,255,255,.10);--ok-text:#0ca30c;--hover:rgba(240,239,236,.07);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
header{max-width:1180px;margin:0 auto}
main{min-width:0}
header{padding:28px 0 4px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0}
#odswiezono{color:var(--ink2);margin:6px 0 0;font-size:14px}
section{margin-top:28px}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:18px;margin:0;letter-spacing:-.01em}
h4{font-size:15px;margin:0}
h5{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
a{color:var(--link)}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--hover);padding:0 4px;border-radius:4px}
.licznik{display:inline-flex;min-width:26px;height:26px;padding:0 8px;align-items:center;justify-content:center;
  border-radius:999px;background:var(--ink);color:var(--page);font-size:14px;font-variant-numeric:tabular-nums}
.licznik.zero{background:var(--grid);color:var(--ink2)}
.komunikat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-top:20px;color:var(--ink2)}
.pusto{color:var(--muted);font-size:14px;padding:8px 0}
.kropka{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* Czeka na Ciebie */
.czeka-box{background:color-mix(in srgb,var(--s2) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--s2) 35%,var(--border));border-left:6px solid var(--s2);border-radius:var(--r);padding:14px 16px 6px}
.czeka-box h2{margin:0 0 12px}
.czeka-cialo{padding:0}
.pytanie{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.pytanie.nowe{border-color:var(--s2)}
.pytanie .glowa{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px;font-size:13px;color:var(--ink2)}
.pytanie .tresc{font-size:16px;font-weight:500}
.pytanie{overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--hover);font-size:13px;color:var(--ink2);white-space:nowrap}
.znacznik-nowe{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--s2);color:#0b0b0b;font-weight:700}
.opcje{margin-top:8px}
.opcja{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--grid);font-size:15px;color:var(--ink2)}
.opcja .litera{font-weight:700;font-variant-numeric:tabular-nums}
.opcja.rek{color:var(--ink);font-weight:600}
.opcja.rek .litera{color:var(--ok-text)}
.tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--s3) 22%,var(--surface));color:var(--ink);vertical-align:1px}
button{font:inherit;color:inherit}

/* Przegląd */
.kafle{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.kafle{grid-template-columns:repeat(4,1fr)}}
.kafel{--k:var(--s1);background:color-mix(in srgb,var(--k) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 30%,var(--border));border-top:5px solid var(--k);border-radius:var(--r);padding:12px 16px 14px;min-width:0}
.kafel .et{color:var(--ink);font-size:13px;font-weight:600}
.kafel .wart{font-size:30px;font-weight:650;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kafel .pod{color:var(--ink2);font-size:13px;margin-top:2px}
.kafel.klik{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.kafel.klik:hover{background:color-mix(in srgb,var(--k) 20%,var(--surface))}
.kafel.szeroki{grid-column:1/-1}
.okno{display:grid;gap:8px 24px;grid-template-columns:auto 1fr;align-items:end}
@media (max-width:560px){.okno{grid-template-columns:1fr}}
.pasek{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.pasek>i{display:block;height:100%;background:var(--s1);border-radius:4px}
.wykresy{display:grid;gap:12px;margin-top:12px}
@media (min-width:860px){.wykresy.dwa{grid-template-columns:1fr 1fr}.wykresy .caly{grid-column:1/-1}}

/* Wykres */
figure.wykres{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;min-width:0}
.wn{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.podpis{color:var(--muted);font-size:13px;margin-top:2px}
.przelacz{flex:none;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:13px;color:var(--ink2);cursor:pointer}
.przelacz:hover{background:var(--hover)}
.legenda{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.legenda li{display:inline-flex;align-items:center;gap:6px}
.plot{min-height:40px}
.plot svg{display:block;overflow:visible}
.siatka{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.os{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.etykieta{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.etykieta.ink{fill:var(--ink2);font-size:12px}
.traf{fill:transparent}
.traf.aktywny{fill:var(--hover)}
.slupek{pointer-events:none}
.teraz{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--ink2);font-weight:600}
tbody th{font-weight:500}
/* poziome */
.poziome{display:grid;gap:8px}
.pw{display:grid;grid-template-columns:minmax(110px,26%) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:2px 4px;border-radius:6px}
.pw.aktywny{background:var(--hover)}
.pw .et{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw .wart{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:56px;text-align:right}
.tor{height:16px;pointer-events:none}
.tor>div{display:flex;gap:2px;height:100%}
.tor i{display:block;height:100%;min-width:2px}
.tor i:last-child{border-radius:0 4px 4px 0}
/* kryteria */
.miernik{display:flex;gap:2px;margin:6px 0 10px}
.miernik i{flex:1;height:8px;border-radius:2px;background:var(--grid)}
.miernik i.z{background:var(--s1)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:8px;padding:4px 0;font-size:14px}
.lista .zn{flex:none;width:18px;text-align:center;font-weight:700}
.lista .zn.ok{color:var(--ok-text)}
.lista .zn.nie{color:var(--muted)}

/* Karty projektów */
.karta{--pk:var(--s1);background:var(--surface);border:1px solid color-mix(in srgb,var(--pk) 30%,var(--border));border-left:8px solid var(--pk);border-radius:var(--r);margin-bottom:12px}
.karta>.glowa{background:color-mix(in srgb,var(--pk) 14%,var(--surface));padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;border-radius:var(--r)}
.karta>.glowa h3{margin:0}
.glowa .kropka{width:12px;height:12px}
.glowa .opis{grid-column:2;color:var(--ink2);font-size:14px}
.glowa .chipy{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strzalka{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
details[open]>summary .strzalka{transform:rotate(225deg);margin-bottom:-4px}
.cialo{padding:16px 16px 18px;display:grid;gap:16px}
.cialo figure.wykres{background:var(--page)}
.blok{background:var(--page);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;min-width:0}
.blok>h4{margin-bottom:8px}
.meta{color:var(--ink2);font-size:14px;margin-bottom:6px}
.kolumny{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.punkty{margin:0;padding-left:18px;font-size:14px}
.punkty li{padding:3px 0}
.zadania{display:grid;gap:8px}
.zadanie{background:var(--page);border:1px solid var(--border);border-radius:10px;padding:0 12px}
.zadanie>summary{display:flex;gap:8px;align-items:baseline;min-height:40px;padding:9px 0;cursor:pointer;list-style:none;font-size:14px}
.zadanie>summary::-webkit-details-marker{display:none}
.zadanie .nr{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.zadanie .tyt{min-width:0}
.zadanie[open]>summary{border-bottom:1px solid var(--grid)}
.tablica{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kol-zad{border-radius:12px;padding:8px;background:var(--surface);border:1px dashed transparent;transition:background .15s,border-color .15s}
.kol-zad.nad{border-color:var(--ink2);background:var(--hover)}
.kol-zad h5{margin:2px 4px 8px}
.odlozone{margin-top:12px}
.odlozone>summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
.zadanie>summary{cursor:pointer;user-select:none;-webkit-user-select:none}
.zadanie[data-nr]>summary{cursor:grab}
.zadanie .uchwyt{flex:none;color:var(--muted);touch-action:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin:-12px -6px -12px -10px;cursor:grab}
.przenies{display:none;margin-top:10px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
@media (pointer:coarse),(max-width:719px){.przenies{display:block}}
.zadanie.ciagniety{opacity:.35}
.zadanie.duch{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);transform:rotate(1.5deg)}
.zadanie .opis{font-size:14px;color:var(--ink2);padding:8px 0 12px;line-height:1.45}
.decyzja{display:grid;grid-template-columns:62px minmax(0,1fr);overflow-wrap:anywhere;gap:8px;padding:6px 0;border-top:1px solid var(--grid);font-size:14px}
.cialo,.blok,.pytanie,.karta li{overflow-wrap:anywhere}
.decyzja:first-of-type{border-top:0}
.decyzja .kiedy{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
details.starsze>summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:6px 0}
.historia li{padding:6px 0;border-top:1px solid var(--grid);list-style:none}
.historia li:first-child{border-top:0}
/* stany wątków */
.stan{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink);
  background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);white-space:nowrap}
.stan::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.stan.toku{--c:var(--s1)}.stan.scalone{--c:var(--s3)}.stan.czeka{--c:var(--s4)}.stan.cisza{--c:var(--s8)}
.watki-lista{display:grid;gap:8px;margin-top:12px}
.wl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.wl .nazwa{font-weight:600;overflow-wrap:anywhere;min-width:0}
@media (max-width:719px){.wl{grid-template-columns:minmax(0,1fr)}.wl .stany{justify-self:start;flex-wrap:wrap}}
.kto-watku{color:var(--ink2);font-weight:400;font-size:13px}
.wl .ost{grid-column:1/-1;color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
.stany{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip.postep-archi{display:block;white-space:normal;overflow-wrap:anywhere;border-radius:12px}
.historia{margin:0;padding:0}
.historia .kiedy{color:var(--muted);font-size:13px}
/* dymek */
#dymek{position:fixed;z-index:10;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:260px;font-variant-numeric:tabular-nums}
#dymek .dt{font-weight:600;margin-bottom:4px}
#dymek .dw{display:flex;align-items:center;gap:6px}
#dymek .dw .n{color:var(--ink2);flex:1}
#dymek .dw .v{margin-left:12px}
#dymek .dr{color:var(--ink2)}
#ramka{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 24px;max-width:1180px;margin:8px auto 0;align-items:start}
#skok{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px;padding:4px 0}
#skok button{--pk:var(--ink2);display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid transparent;border-left:5px solid transparent;background:var(--hover);
  color:var(--ink);font-size:15px;min-height:44px;cursor:pointer}
#skok button:hover{background:var(--border)}
#skok button.aktywny{background:color-mix(in srgb,var(--pk) 20%,var(--surface));border-color:color-mix(in srgb,var(--pk) 40%,var(--border));border-left-color:var(--pk);font-weight:650}
#skok button .nazwa{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#skok .znacznik-nowe{font-size:11px;padding:0 7px}
@media (max-width:719px){
  #ramka{display:block}
  #skok{position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;margin:0 0 8px;padding:8px 0;background:var(--page);border-bottom:1px solid var(--border);scrollbar-width:none}
  #skok::-webkit-scrollbar{display:none}
  #skok button{width:auto;flex:none;border-radius:999px;min-height:40px;padding:6px 14px;border-left-width:1px;white-space:nowrap}
  #skok button.aktywny{border-left-color:var(--pk)}
  #skok.wiecej-prawo{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
}
.prac{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--pk,var(--border))}
.pr .kto{font-weight:600;overflow-wrap:anywhere}
.pr .gdzie,.pr .ost{color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
.pr .ost{grid-column:1/-1}
.pr .tok{text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pr.koniec{opacity:.6}
.stan-pr{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hover);margin-left:6px}
.stan-pr.pracuje{color:var(--ok-text)}
.wiecej{margin-top:8px;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--ink2);font:inherit;font-size:13px;cursor:pointer;min-height:44px}
/* oś czasu pracowników */
.zakres{color:var(--ink2);font-size:13px;margin:0 0 8px;font-variant-numeric:tabular-nums}
.os-plot{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.os-plot svg{touch-action:pan-y}
.os-plot.ciagnie{cursor:grabbing}
.os-plot.nieprzewija{cursor:default;touch-action:auto}
.os-plot.nieprzewija svg{touch-action:auto}
.os-gora{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin:0 0 8px}
.os-gora .zakres{margin:0}
.os-przel{display:flex;gap:6px}
.przelacz[aria-pressed="true"]{background:var(--hover);color:var(--ink);border-color:var(--ink2)}
.etykieta.przerwa{font-size:11px;fill:var(--ink2)}
.etykieta.data{font-weight:600;fill:var(--ink2)}
.etykieta.szary{opacity:.45}
/* zwijane bloki */
.sekcja-zw>summary,.prac-zw>summary{cursor:pointer;list-style:none;display:flex;align-items:center;min-height:44px}
.sekcja-zw>summary::-webkit-details-marker,.prac-zw>summary::-webkit-details-marker{display:none}
.sekcja-zw>summary{min-height:32px}
.sekcja-zw[open]>summary{margin-bottom:8px}
.prac-zw>summary h2{margin:0}
.prac-zw[open]>summary{margin-bottom:8px}
.sekcja-zw>summary h4,.prac-zw>summary h2{display:flex;align-items:center;gap:8px;margin:0}
.sekcja-zw>summary h4::before,.prac-zw>summary h2::before{content:"›";display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
.sekcja-zw[open]>summary h4::before,.prac-zw[open]>summary h2::before{transform:rotate(90deg)}
.przenies-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.przenies-lista button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--hover);font:inherit;font-size:14px;color:var(--ink)}
/* klocki projektów */
.klocki{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.klocek{--pk:var(--s1);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;cursor:pointer;font-size:15px;color:var(--ink);
  background:color-mix(in srgb,var(--pk) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--pk) 45%,var(--border));max-width:100%}
.klocek:hover{background:color-mix(in srgb,var(--pk) 26%,var(--surface))}
.klocek.aktywny{background:color-mix(in srgb,var(--pk) 38%,var(--surface));border-color:var(--pk);font-weight:700}
.tryb{margin-left:6px;font-size:1.1em;line-height:1;white-space:nowrap}
.tryb small{font-size:.7em;margin-left:3px;color:var(--muted,inherit)}
.klocek .tryb{margin-left:0}
.klocek .nazwa{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main section{scroll-margin-top:16px}

<script>
"use strict";
const $=id=>document.getElementById(id);
const SVGNS="http://www.w3.org/2000/svg";
function el(tag,attrs,...dzieci){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  }
  for(const d of dzieci.flat()){if(d==null||d===false)continue;e.append(d instanceof Node?d:String(d));}
  return e;
}
function s(tag,attrs){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==="fill"||k==="stroke")e.style[k]=v;else e.setAttribute(k,v);}
  return e;
}
function sTekst(attrs,t){const e=s("text",attrs);e.textContent=t;return e;}
const MD_RE=/(\*\*[^*\n]+\*\*|`[^`\n]+`|https?:\/\/[^\s<>)\]]+)/g;
/* Tekst z Stan.md/Zadania.md → węzły DOM: **pogrubienie**, `kod`, adresy http(s); bez innerHTML. */
function bogaty(t){
  t=tekst(t);const w=[];let ost=0,m;MD_RE.lastIndex=0;
  while((m=MD_RE.exec(t))){
    if(m.index>ost)w.push(t.slice(ost,m.index));
    const x=m[0];
    if(x.startsWith("**"))w.push(el("strong",{},x.slice(2,-2)));
    else if(x[0]==="`")w.push(el("code",{},x.slice(1,-1)));
    else{let url=x,kon="";const k=url.match(/[.,;:!?]+$/);if(k){kon=k[0];url=url.slice(0,-kon.length);}
      w.push(el("a",{href:url,target:"_blank",rel:"noopener noreferrer"},url));if(kon)w.push(kon);}
    ost=m.index+x.length;
  }
  if(ost<t.length)w.push(t.slice(ost));
  return w;
}
function kropka(kolor){const e=el("span",{class:"kropka"});e.style.background=kolor;return e;}
const tab=x=>Array.isArray(x)?x:[];
const tekst=x=>typeof x==="string"?x:(x==null?"":String(x));
const liczba=x=>(typeof x==="number"&&isFinite(x))?x:0;
const obj=x=>(x&&typeof x==="object"&&!Array.isArray(x))?x:{};
const fKompakt=new Intl.NumberFormat("pl-PL",{notation:"compact",maximumFractionDigits:1});
const fLiczba=new Intl.NumberFormat("pl-PL");
const fDzien=new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short"});
const fDzienPelny=new Intl.DateTimeFormat("pl-PL",{weekday:"short",day:"numeric",month:"long"});
const fGodz=new Intl.DateTimeFormat("pl-PL",{hour:"2-digit",minute:"2-digit"});
const fPelna=new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
const fDzienRok=new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short",year:"numeric"});
const fData=d=>d.getFullYear()===new Date().getFullYear()?fDzien.format(d):fDzienRok.format(d);
const fCzas=new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const DZIEN_RE=/^\d{4}-\d{2}-\d{2}$/;
function data(t){
  t=tekst(t);if(!t)return null;
  if(DZIEN_RE.test(t))t+="T00:00:00";
  else if(/^\d{4}-\d{2}-\d{2} \d/.test(t))t=t.replace(" ","T");
  const d=new Date(t);return isNaN(d)?null:d;
}
const dwa=n=>String(n).padStart(2,"0");
function kluczDnia(d){return d.getFullYear()+"-"+dwa(d.getMonth()+1)+"-"+dwa(d.getDate());}
function ostatnieDni(n){const w=[];const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(n-1));for(let i=0;i<n;i++){w.push(kluczDnia(d));d.setDate(d.getDate()+1);}return w;}
function odm(n,a,b,c){n=Math.abs(n);if(n===1)return a;const j=n%10,d=n%100;return(j>=2&&j<=4&&(d<12||d>14))?b:c;}
function temu(d){
  if(!d)return"nie wiadomo";
  const min=Math.floor((Date.now()-d.getTime())/60000);
  if(min<1)return"przed chwilą";
  if(min<60)return min+" min temu";
  const h=Math.floor(min/60);if(h<24)return h+" h temu";
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date();b.setHours(0,0,0,0);
  const dni=Math.round((b-a)/864e5);return dni<=1?"wczoraj":dni+" dni temu";
}
function ticki(max,calk){
  if(!(max>0))return{gora:1,wartosci:[0,1]};
  const raw=max/4;let mag=Math.pow(10,Math.floor(Math.log10(raw)));
  if(calk&&mag<1)mag=1;
  const kroki=calk?[1,2,5,10]:[1,2,2.5,5,10];
  let krok=kroki.map(k=>k*mag).find(k=>k>=raw)||10*mag;
  if(calk)krok=Math.max(1,Math.round(krok));
  const gora=Math.ceil(max/krok)*krok;const wartosci=[];
  for(let v=0;v<=gora+krok/1e6;v+=krok)wartosci.push(Math.round(v*1e6)/1e6);
  return{gora,wartosci};
}
const zaokr=(x,y,w,h,r)=>`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;

/* ---------- dane ---------- */
function norm(id,d){
  d=obj(d);
  const p=(d.podroz&&typeof d.podroz==="object"&&!Array.isArray(d.podroz))?d.podroz:null;
  const dec=obj(d.decyzje),zad=obj(d.zadania),k=obj(d.koszty),o=obj(k.okno5h),lim=obj(k.limit);
  const dl=x=>tab(x).map(z=>{z=obj(z);return{data:tekst(z.data),tresc:tekst(z.tresc)};}).filter(z=>z.tresc);
  const ls=x=>tab(x).map(tekst).filter(Boolean);
  return{
    klucz:id,nazwa:tekst(d.nazwa)||id,kolorId:tekst(d.kolor),opis:tekst(d.opis),repo:tekst(d.repo),
    wygenerowano:data(d.wygenerowano),puls:data(d.puls),tryb:(t=>t.tryb?{tryb:tekst(t.tryb),od:tekst(t.od),do:tekst(t.do),stan:tekst(t.stan)}:null)(obj(d.tryb)),
    podroz:p?{numer:tekst(p.numer),temat:tekst(p.temat),start:data(p.start),tryb:tekst(p.tryb),
      kryteria:tab(p.kryteria).map(z=>{z=obj(z);return{tekst:tekst(z.tekst),zrobione:z.zrobione===true};}).filter(z=>z.tekst),
      watki:tab(p.watki).map(w=>{w=obj(w);return{nazwa:tekst(w.nazwa)||"bez nazwy",kto:tekst(w.kto)||"nie wiadomo",stan:tekst(w.stan)||"nie wiadomo",galaz:tekst(w.galaz),start:data(w.start),scalono:data(w.scalono)};})}:null,
    czeka:tab(d.czeka).map(c=>{c=obj(c);return{id:tekst(c.id),tresc:tekst(c.tresc),
      opcje:tab(c.opcje).map(z=>{z=obj(z);return{litera:tekst(z.litera),tekst:tekst(z.tekst),rekomendowana:z.rekomendowana===true};}).filter(z=>z.litera||z.tekst)};}).filter(c=>c.tresc),
    decyzje:{szefa:dl(dec.szefa),archiego:dl(dec.archiego)},
    zadania:{w_toku:ls(zad.w_toku),nastepnie:ls(zad.nastepnie),zaplanowane:ls(zad.zaplanowane),zrobione:ls(zad.zrobione),odlozone:ls(zad.odlozone)},
    aktywnosc:tab(d.aktywnosc).map(a=>{a=obj(a);return{nazwa:tekst(a.nazwa),rola:tekst(a.rola)||"pomo",watek:tekst(a.watek),
      odcinki:tab(a.odcinki).map(o=>{o=tab(o);return[data(o[0]),data(o[1])];}).filter(o=>o[0]&&o[1])};}).filter(a=>a.nazwa),
    historia:tab(d.historia).map(h=>{h=obj(h);return{numer:tekst(h.numer),temat:tekst(h.temat),start:data(h.start),koniec:data(h.koniec),od:data(h.od),do:data(h.do),podsumowanie:tekst(h.podsumowanie)};}),
    ostatniaPodroz:(()=>{const o=obj(d.ostatnia_podroz),od=data(o.od),dd=data(o.do);return od&&dd?{nazwa:tekst(o.nazwa)||"Ostatnia podróż",od,do:dd,doDzien:DZIEN_RE.test(tekst(o.do))}:null;})(),
    koszty:{
      dni:tab(k.dni).map(z=>{z=obj(z);return{dzien:tekst(z.dzien),wazone:liczba(z.wazone),wejscie:liczba(z.wejscie),wyjscie:liczba(z.wyjscie),cache_odczyt:liczba(z.cache_odczyt),cache_zapis:liczba(z.cache_zapis)};}).filter(z=>DZIEN_RE.test(z.dzien)),
      role:tab(k.role).map(z=>{z=obj(z);return{podroz:tekst(z.podroz),rola:tekst(z.rola),wazone:liczba(z.wazone)};}),
      okno5h:{od:data(o.od),reset:data(o.reset),wazone:liczba(o.wazone)},
      limit:k.limit&&typeof lim.used==="number"?{used:liczba(lim.used),reset:data(lim.reset),czas:data(lim.czas)}:null
    },
    commity:tab(d.commity).map(z=>{z=obj(z);return{dzien:tekst(z.dzien),liczba:liczba(z.liczba)};}).filter(z=>DZIEN_RE.test(z.dzien))
  };
}
const ROLE=[{nazwa:"Archi",kolor:"var(--s1)"},{nazwa:"wyko",kolor:"var(--s2)"},{nazwa:"agenci",kolor:"var(--s3)"},{nazwa:"pomo",kolor:"var(--s4)"},{nazwa:"Fable",kolor:"var(--s7)"}];
const rolaKolor=r=>{const x=ROLE.find(z=>z.nazwa===r);return x?x.kolor:"var(--muted)";};
/* Kolor projektu jest stały (pole `kolor` z projekty.yaml: s1..s8, szmaragd, kosmos; bez niego z nazwy), nie zależy od kolejności. */
function kolorProjektu(p,i,n){
  if(n>8&&i>=7)return"var(--muted)";
  let id=p.kolorId;
  if(!/^(s[1-8]|szmaragd|kosmos)$/.test(id)){let h=0;for(const c of p.nazwa)h=(h*31+c.charCodeAt(0))>>>0;id="s"+(h%8+1);}
  return`var(--${id})`;
}
function mapaDni(lista,pole){const m={};for(const z of lista)m[z.dzien]=(m[z.dzien]||0)+liczba(z[pole]);return m;}
function serieProjektow(P,fn){
  const serie=P.map((p,i)=>({nazwa:p.nazwa,kolor:p.kolor,wartosci:fn(p)}));
  if(P.length<=8)return serie;
  const inne={nazwa:"Inne",kolor:"var(--muted)",wartosci:{}};
  for(const se of serie.slice(7))for(const[d,v]of Object.entries(se.wartosci))inne.wartosci[d]=(inne.wartosci[d]||0)+v;
  return[...serie.slice(0,7),inne];
}
const fTok=(v,os)=>os?fKompakt.format(v):fLiczba.format(Math.round(v));
const fCom=v=>fLiczba.format(Math.round(v));

/* ---------- dymek ---------- */
const dymek=$("dymek");let aktywny=null;
function pokazDymek(cel,x,y){
  const tip=cel.__tip;if(!tip)return;
  if(aktywny&&aktywny!==cel)aktywny.classList.remove("aktywny");
  aktywny=cel;cel.classList.add("aktywny");
  const[tyt,...wiersze]=tip;
  dymek.replaceChildren(el("div",{class:"dt"},tyt));
  for(const w of wiersze){
    if(typeof w==="string")dymek.append(el("div",{class:"dr"},w));
    else dymek.append(el("div",{class:"dw"},kropka(w.kolor),el("span",{class:"n"},w.nazwa),el("span",{class:"v"},w.wartosc)));
  }
  dymek.hidden=false;
  const r=dymek.getBoundingClientRect();
  let lx=x+14;if(lx+r.width>innerWidth-8)lx=Math.max(8,x-14-r.width);
  let ty=y-r.height-12;if(ty<8)ty=Math.min(innerHeight-r.height-8,y+18);
  dymek.style.left=lx+"px";dymek.style.top=ty+"px";
}
function ukryjDymek(){dymek.hidden=true;if(aktywny){aktywny.classList.remove("aktywny");aktywny=null;}}
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const c=e.target.closest&&e.target.closest("[data-tip]");if(c)pokazDymek(c,e.clientX,e.clientY);else if(aktywny)ukryjDymek();});
document.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;const c=e.target.closest&&e.target.closest("[data-tip]");if(c)pokazDymek(c,e.clientX,e.clientY);else ukryjDymek();});
addEventListener("scroll",()=>{if(aktywny)ukryjDymek();},{passive:true});

/* ---------- pamięć rozwinięć (details) i przełącznika Tabela ---------- */
let UIOPEN={},PRAC_RECZNIE=null,KONTEKST="";
const TABELE=new Set();
try{const t=localStorage.getItem("dziennik.otwarte");if(t){const o=JSON.parse(t);if(o&&typeof o==="object"&&!Array.isArray(o))UIOPEN=o;}}catch(e){}
function kluczDetails(d){
  const ctx=(d.closest("section[id]")||{}).id||"";
  const sm=d.querySelector(":scope>summary");
  const co=d.dataset.nr?"z:"+d.dataset.nr:(sm?sm.textContent.replace(/\s*\(\d+\)/g,"").trim():"");
  return ctx+"|"+co;
}
function zapamietajOtwarcie(d,otw){
  if(d.hasAttribute("data-prac")){PRAC_RECZNIE=otw;return;}
  UIOPEN[kluczDetails(d)]=otw;
  const k=Object.keys(UIOPEN);if(k.length>300)for(const x of k.slice(0,k.length-300))delete UIOPEN[x];
  try{localStorage.setItem("dziennik.otwarte",JSON.stringify(UIOPEN));}catch(e){}
}
document.addEventListener("click",e=>{
  const sm=e.target.closest&&e.target.closest("summary");if(!sm)return;
  const d=sm.parentElement;if(d&&d.tagName==="DETAILS")zapamietajOtwarcie(d,!d.open);
});
function przywrocOtwarcia(){
  document.querySelectorAll("main details").forEach(d=>{
    if(d.hasAttribute("data-prac"))return;
    const k=kluczDetails(d);if(k in UIOPEN)d.open=UIOPEN[k]===true;
  });
}

/* ---------- ramka wykresu ---------- */
const rysunki=new Set();
function rysujWszystko(){
  for(const r of rysunki){
    if(!r.plot.isConnected){rysunki.delete(r);continue;}
    if(r.plot.hidden||r.plot.clientWidth===0)continue;
    try{r.rysuj(r.plot);}catch(e){r.plot.replaceChildren(el("p",{class:"pusto"},"Nie udało się narysować wykresu."));}
  }
}
let rafId=0;function poRenderze(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(rysujWszystko);}
let rozmiarT=0;addEventListener("resize",()=>{clearTimeout(rozmiarT);rozmiarT=setTimeout(rysujWszystko,150);});
function ramka(tytul,podpis,legenda,tresc,tabela,klasa){
  const plot=el("div",{class:"plot"});
  const tabDiv=el("div",{class:"tabela",hidden:true},tabela);
  const przycisk=el("button",{class:"przelacz",type:"button","aria-pressed":"false"},"Tabela");
  const kluczT=KONTEKST+"|"+tytul;
  const ustawTabele=pokaz=>{
    tabDiv.hidden=!pokaz;plot.hidden=pokaz;
    przycisk.textContent=pokaz?"Wykres":"Tabela";przycisk.setAttribute("aria-pressed",String(pokaz));
  };
  przycisk.addEventListener("click",()=>{
    const pokazTabele=tabDiv.hidden;ustawTabele(pokazTabele);
    if(pokazTabele)TABELE.add(kluczT);else TABELE.delete(kluczT);
    if(!pokazTabele)poRenderze();
  });
  if(tabela&&TABELE.has(kluczT))ustawTabele(true);
  if(typeof tresc==="function")rysunki.add({plot,rysuj:tresc});else if(tresc)plot.append(tresc);
  return el("figure",{class:"wykres"+(klasa?" "+klasa:"")},
    el("div",{class:"wn"},el("div",{},el("h4",{},tytul),podpis?el("p",{class:"podpis"},podpis):null),tabela?przycisk:null),
    legenda&&legenda.length>=2?el("ul",{class:"legenda"},legenda.map(l=>el("li",{},kropka(l.kolor),l.nazwa))):null,
    plot,tabela?tabDiv:null);
}
function tabelka(naglowki,wiersze){
  if(!wiersze.length)return el("p",{class:"pusto"},"Brak danych.");
  return el("table",{},el("thead",{},el("tr",{},naglowki.map(n=>el("th",{scope:"col"},n)))),
    el("tbody",{},wiersze.map(w=>el("tr",{},w.map((c,i)=>i===0?el("th",{scope:"row"},c):el("td",{},c))))));
}

/* ---------- słupki dzień po dniu ---------- */
function slupki(dni,serie,fmt,calk,opis){
  return plot=>{
    const W=Math.max(240,plot.clientWidth),H=200,ml=52,mr=8,mt=10,mb=24,iw=W-ml-mr,ih=H-mt-mb,n=dni.length;
    const sumy=dni.map(d=>serie.reduce((a,se)=>a+liczba(se.wartosci[d]),0));
    const max=Math.max(0,...sumy);
    if(max<=0){plot.replaceChildren(el("p",{class:"pusto"},"Brak danych z ostatnich "+n+" dni."));return;}
    const{gora,wartosci}=ticki(max,calk);const y=v=>mt+ih-(v/gora)*ih;
    const svg=s("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opis});
    for(const v of wartosci){
      svg.append(s("line",{x1:ml,x2:W-mr,y1:y(v),y2:y(v),class:v===0?"os":"siatka"}));
      svg.append(sTekst({x:ml-6,y:y(v)+4,"text-anchor":"end",class:"etykieta"},fmt(v,true)));
    }
    const krok=iw/n,bw=Math.min(24,Math.max(4,krok*.6));
    const co=Math.ceil(n/Math.max(1,Math.floor(iw/46)));
    dni.forEach((d,i)=>{
      const cx=ml+krok*(i+.5),dd=data(d);
      const traf=s("rect",{x:ml+krok*i,y:mt,width:krok,height:ih,rx:4,class:"traf","data-tip":""});
      const tip=[fDzienPelny.format(dd)];
      for(const se of serie){const v=liczba(se.wartosci[d]);if(v>0)tip.push({kolor:se.kolor,nazwa:se.nazwa,wartosc:fmt(v)});}
      if(sumy[i]===0)tip.push("brak");else if(serie.length>1)tip.push("Razem: "+fmt(sumy[i]));
      traf.__tip=tip;svg.append(traf);
      const segs=serie.map(se=>({kolor:se.kolor,v:liczba(se.wartosci[d])})).filter(z=>z.v>0);
      let baza=0;
      segs.forEach((z,j)=>{
        const y0=y(baza)-(j>0?2:0);baza+=z.v;const y1=y(baza);
        const h=Math.max(1,y0-y1),top=y0-h;
        if(j===segs.length-1)svg.append(s("path",{d:zaokr(cx-bw/2,top,bw,h,Math.min(4,h/2,bw/2)),class:"slupek",fill:z.kolor}));
        else svg.append(s("rect",{x:cx-bw/2,y:top,width:bw,height:h,class:"slupek",fill:z.kolor}));
      });
      if((n-1-i)%co===0)svg.append(sTekst({x:cx,y:H-6,"text-anchor":"middle",class:"etykieta"},fDzien.format(dd)));
    });
    plot.replaceChildren(svg);
  };
}
function wykresDni(tytul,podpis,dni,serie,fmt,calk,klasa){
  const wiersze=dni.slice().reverse().map(d=>{const v=serie.map(se=>liczba(se.wartosci[d]));const r=v.reduce((a,b)=>a+b,0);return r>0?[fDzien.format(data(d)),...v.map(x=>fmt(x)),...(serie.length>1?[fmt(r)]:[])]:null;}).filter(Boolean);
  const tabela=tabelka(["Dzień",...serie.map(se=>se.nazwa),...(serie.length>1?["Razem"]:[])],wiersze);
  return ramka(tytul,podpis,serie.map(se=>({nazwa:se.nazwa,kolor:se.kolor})),slupki(dni,serie,fmt,calk,tytul),tabela,klasa);
}

/* ---------- kto zużywa (poziome) ---------- */
function wykresRole(tytul,podpis,wiersze,klasa){
  // wiersze: [{etykieta, wartosci:{rola:v}}]
  const role=ROLE.map(r=>r.nazwa);
  const znane=new Set(role);

const GODZINA=36e5,ZAPAS=3*6e4;

/* Rzędy osi: Archi sam w pierwszym; wyko i pomo pakowane zachłannie (sesja trafia do najniższego wolnego rzędu).

   Liczba rzędów = największa liczba sesji pracujących naraz w całych danych; układ nie zależy od okna. */
function ukladRzedow(akt){

  const inni=akt.filter(a=>a.rola!=="Archi"&&a.odcinki.length).map(a=>({a,od:Math.min(...a.odcinki.map(o=>o[0].getTime()))-ZAPAS,do:Math.max(...a.odcinki.map(o=>o[1].getTime()))+ZAPAS})).sort((x,y)=>x.od-y.od);

/* Podpis rzędu: sesja pracująca najbliżej lewej krawędzi okna [t0,t1]; gdy w oknie nic, ostatnia przed krawędzią (szara). */
function podpisRzedu(rz,t0,t1){

const podpisSesji=a=>!a?"":a.rola==="Archi"?"Archi":(a.rola==="wyko"&&a.watek?a.watek:a.nazwa);
function opisStanu(p,a){

const fOd=d=>fCzas.format(d),fDo=(a,b)=>(a.toDateString()===b.toDateString()?fGodz.format(b):fCzas.format(b));

/* Zakres osi: [A,B] w ms oraz podpis. Widok „podroz”: bieżąca podróż od startu do teraz albo ostatnia zakończona; „wszystko”: 7 dni. */
function zakresOsi(p,widok,teraz){

/* ---------- postęp na żywo (kolekcja `postep`) ---------- */
let POSTEP=[];
const GODZ=36e5;
function normPostep(id,d){
  d=obj(d);
  return{id:tekst(id),projekt:tekst(d.projekt),watek:tekst(d.watek),rola:tekst(d.rola),krok:tekst(d.krok),
    commity:liczba(d.commity),galaz:tekst(d.galaz),czas:data(d.czas)};
}
function postepWatku(p,w){
  let naj=null;
  for(const x of POSTEP){
    if(x.projekt!==p.nazwa||!x.czas||!x.watek)continue;  // postęp Archiego (bez wątku) idzie przy projekcie
    if((x.watek&&x.watek===w.nazwa)||(x.galaz&&w.galaz&&x.galaz===w.galaz)){if(!naj||x.czas>naj.czas)naj=x;}
  }
  return naj;
}
function postepArchiego(p){
  let naj=null;
  for(const x of POSTEP)if(x.projekt===p.nazwa&&!x.watek&&x.czas&&(!naj||x.czas>naj.czas))naj=x;
